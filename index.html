<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Graduación</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importar fuente Parisienne (letra de carta muy elegante) y Lora -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">
</head>
<body>

    <div id="app-container">
        <!-- Portada / Sobre -->
        <!-- Portada / Gala de Noche -->
        <section class="slide" id="cover">
            <div class="cover-gala">
                <!-- Sello con birrete elegante de oro -->
                <div class="gala-badge">
                    <img src="img/birrete-gala.png" class="cap-gala-icon" alt="Birrete de Gala">
                </div>

                <!-- Textos con mayor contraste y elegancia -->
                <h1 class="gala-typing">¡Estás invitado!</h1>
                <p class="gala-sub">MI GRADUACIÓN</p>
                <p class="gala-date">Viernes, 04 de Diciembre, 2026</p>
            </div>

            <!-- El botón de abrir se queda abajo, en un dorado precioso -->
            <button id="open-btn">T O C A R &nbsp; P A R A &nbsp; A B R I R</button>
        </section>

        <!-- Detalles del evento -->
        <section class="slide" id="details">
            <div class="content">
                <!-- El marco de foto circular -->
                <div class="photo-gallery">
                    <div class="photo-frame circle">
                        <img src="img/foto1.jpg" alt="Foto Alexa">
                    </div>
                </div>

                <p class="subtitle">Acompáñame a celebrar mi</p>
                <h2 class="title-grad">Graduación</h2>

                <div class="event-info">
                    <p class="date">Viernes, 04 de Diciembre</p>
                    <p class="time">05:30 PM</p>
                    <p class="location">Casa de habitación</p>
                </div>

                <p class="invites">Invita:</p>
                <h3 class="host-name">Alexa Loireth Centeno Picado</h3>
            </div>
        </section>

        <!-- Confirmación de asistencia -->
        <section class="slide" id="rsvp">
            <div class="content floral-bg">
                <h2>Confirma tu asistencia</h2>
                <form id="rsvp-form">
                    <input type="text" placeholder="Tu nombre y apellido" required>
                    <select required>
                        <option value="" disabled selected>¿Asistirás?</option>
                        <option value="si">¡Sí, ahí estaré!</option>
                        <option value="no">No podré asistir</option>
                    </select>
                    <button type="submit">Enviar confirmación</button>
                </form>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
